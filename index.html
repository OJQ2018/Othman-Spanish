let curLang='ar',curPage=1,perPage=100;let learned=new Set(JSON.parse(localStorage.getItem('learned_es')||'[]'));let catEl=document.getElementById('cat');[...new Set(data.map(d=>d.cat))].forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;catEl.appendChild(o);});function getFiltered(){let q=document.getElementById('search').value.toLowerCase().trim(),cat=catEl.value;return data.filter(d=>{if(cat&&d.cat!==cat)return false;if(!q)return true;return d.es.toLowerCase().includes(q)||d.ar.includes(q)||d.en.toLowerCase().includes(q)||d.de.toLowerCase().includes(q);});}
function speak(t,b){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.85;let vs=speechSynthesis.getVoices();let v=vs.find(x=>x.lang.includes('es'));if(v)u.voice=v;b.classList.add('playing');let orig=b.textContent;b.textContent='⏳...';u.onend=()=>{b.classList.remove('playing');b.textContent='🔊 استماع';};u.onerror=()=>{b.classList.remove('playing');b.textContent='🔊 استماع';};speechSynthesis.speak(u);}catch(e){alert('المتصفح لا يدعم النطق، جرب كروم');}}
function render(){let f=getFiltered(),tp=Math.max(1,Math.ceil(f.length/perPage));if(curPage>tp)curPage=tp;let s=(curPage-1)*perPage,sl=f.slice(s,s+perPage);document.getElementById('stats').textContent='الصفحة '+curPage+' من '+tp+' • الجمل '+(f.length?s+1:0)+'-'+Math.min(s+perPage,f.length)+' من '+f.length;let cards=document.getElementById('cards');cards.innerHTML='';sl.forEach(d=>{let div=document.createElement('div');div.className='card';div.innerHTML='<div style=display:flex;justify-content:space-between><span class=badge>'+d.cat+' • #'+d.id+'</span><span>'+(learned.has(d.id)?'✅':'')+'</span></div><div class=es>'+d.es+'</div><div class="ar '+(curLang==='ar'?'show':'')+'">' + d.ar + '</div><div class="en '+(curLang==='en'?'show':'')+'">🇬🇧 '+d.en+'</div><div class="de '+(curLang==='de'?'show':'')+'">🇩🇪 '+d.de+'</div><div class=actions><button class="btn play">🔊 استماع</button><button class="btn learn">'+(learned.has(d.id)?'✅ تم':'✓ تعلمت')+'</button></div>';let pb=div.querySelector('.play');pb.onclick=()=>speak(d.es,pb);let lb=div.querySelector('.learn');lb.onclick=()=>{if(learned.has(d.id))learned.delete(d.id);else learned.add(d.id);localStorage.setItem('learned_es',JSON.stringify([...learned]));render();};cards.appendChild(div);});function makePag(c){c.innerHTML='';let pr=document.createElement('button');pr.textContent='السابق';pr.disabled=curPage===1;pr.onclick=()=>{curPage--;render();window.scrollTo({top:0,behavior:'smooth'});};c.appendChild(pr);for(let i=1;i<=tp;i++){let b=document.createElement('button');b.textContent=i;if(i===curPage)b.className='active';b.onclick=()=>{curPage=i;render();window.scrollTo({top:0,behavior:'smooth'});};c.appendChild(b);}let nx=document.createElement('button');nx.textContent='التالي';nx.disabled=curPage===tp;nx.onclick=()=>{curPage++;render();window.scrollTo({top:0,behavior:'smooth'});};c.appendChild(nx);}makePag(document.getElementById('pagTop'));makePag(document.getElementById('pagBottom'));}
document.getElementById('search').addEventListener('input',()=>{curPage=1;render();});catEl.addEventListener('change',()=>{curPage=1;render();});document.querySelectorAll('.langs button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.langs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');curLang=b.dataset.lang;render();};});speechSynthesis.getVoices();render();
