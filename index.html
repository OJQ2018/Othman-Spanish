let curTheme=localStorage.getItem('theme_es')||'light';
document.body.className=curTheme;
function setTheme(t){curTheme=t;document.body.className=t;localStorage.setItem('theme_es',t);document.querySelectorAll('.themeBar button').forEach(b=>{b.classList.toggle('active',b.dataset.theme===t);});}
setTimeout(()=>{document.querySelectorAll('.themeBar button').forEach(b=>{b.classList.toggle('active',b.dataset.theme===curTheme);});},100);
let curLang='ar',curPage=1,perPage=100;
let revealed=new Set();
let learned=new Set(JSON.parse(localStorage.getItem('learned_es_easy')||'[]'));
let catEl=document.getElementById('cat');
[...new Set(data.map(d=>d.cat))].forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;catEl.appendChild(o);});
function getFiltered(){
  let q=document.getElementById('search').value.toLowerCase().trim(),cat=catEl.value;
  return data.filter(d=>{
    if(cat&&d.cat!==cat) return false;
    if(!q) return true;
    return d.es.toLowerCase().includes(q)||d.ar.includes(q)||d.en.toLowerCase().includes(q)||d.de.toLowerCase().includes(q);
  });
}
function speak(t,b){
  try{
    speechSynthesis.cancel();
    let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.85;
    let vs=speechSynthesis.getVoices();let v=vs.find(x=>x.lang.includes('es'));if(v) u.voice=v;
    b.classList.add('playing');b.textContent='⏳...';
    u.onend=()=>{b.classList.remove('playing');b.textContent='🔊 استماع';};
    u.onerror=()=>{b.classList.remove('playing');b.textContent='🔊 استماع';};
    speechSynthesis.speak(u);
  }catch(e){}
}
function render(){
  let f=getFiltered(),tp=Math.max(1,Math.ceil(f.length/perPage));if(curPage>tp)curPage=tp;
  let s=(curPage-1)*perPage,sl=f.slice(s,s+perPage);
  document.getElementById('stats').textContent='المستوى '+(Math.ceil((s+1)/100))+' • الصفحة '+curPage+' من '+tp+' • الجمل '+(f.length?s+1:0)+'-'+Math.min(s+perPage,f.length)+' من '+f.length+' • أسهل نسخة ⭐';
  let cards=document.getElementById('cards');cards.innerHTML='';
  sl.forEach(d=>{
    let isRev=revealed.has(d.id);
    let level=d.level;
    let div=document.createElement('div');div.className='card l'+Math.min(level,4);
    let trHTML='';
    if(curLang==='ar') trHTML='<div class="tr ar">🇸🇦 '+d.ar+'</div>';
    else if(curLang==='en') trHTML='<div class="tr en">🇬🇧 '+d.en+'</div>';
    else if(curLang==='de') trHTML='<div class="tr de">🇩🇪 '+d.de+'</div>';
    else trHTML='<div class="tr ar">🇸🇦 '+d.ar+'</div><div class="tr en">🇬🇧 '+d.en+'</div><div class="tr de">🇩🇪 '+d.de+'</div>';
    div.innerHTML='<span class="diff">المستوى '+level+'</span><div style="display:flex;justify-content:space-between"><span class="badge l'+Math.min(level,4)+'">'+d.cat+' • #'+d.id+'</span><span>'+(learned.has(d.id)?'✅':'')+'</span></div><div class="es">'+d.es+'</div><div class="transBox '+(isRev?'show':'')+'">'+trHTML+'</div><div class="actions"><button class="btn play">🔊 استماع</button><button class="btn transBtn '+(isRev?'active':'')+'">'+(isRev?'🙈 إخفاء':'👁️ ترجمة')+'</button><button class="btn learn '+(learned.has(d.id)?'done':'')+'">'+(learned.has(d.id)?'✅ تم حفظه':'✓ تعلمت')+'</button></div>';
    let pb=div.querySelector('.play');pb.onclick=()=>speak(d.es,pb);
    let tb=div.querySelector('.transBtn');
    tb.onclick=()=>{
      if(revealed.has(d.id)) revealed.delete(d.id); else revealed.add(d.id);
      let box=div.querySelector('.transBox');
      if(revealed.has(d.id)){box.classList.add('show');tb.textContent='🙈 إخفاء';tb.classList.add('active');}
      else{box.classList.remove('show');tb.textContent='👁️ ترجمة';tb.classList.remove('active');}
    };
    let lb=div.querySelector('.learn');lb.onclick=()=>{
      if(learned.has(d.id)) learned.delete(d.id); else learned.add(d.id);
      localStorage.setItem('learned_es_easy',JSON.stringify([...learned]));render();
    };
    cards.appendChild(div);
  });
  function makePag(c){c.innerHTML='';let pr=document.createElement('button');pr.textContent='السابق';pr.disabled=curPage===1;pr.onclick=()=>{curPage--;render();scrollTo({top:0,behavior:'smooth'});};c.appendChild(pr);for(let i=1;i<=tp;i++){let b=document.createElement('button');b.textContent=i;if(i===curPage)b.className='active';b.onclick=()=>{curPage=i;render();scrollTo({top:0,behavior:'smooth'});};c.appendChild(b);}let nx=document.createElement('button');nx.textContent='التالي';nx.disabled=curPage===tp;nx.onclick=()=>{curPage++;render();scrollTo({top:0,behavior:'smooth'});};c.appendChild(nx);}
  makePag(document.getElementById('pagTop'));makePag(document.getElementById('pagBottom'));
}
document.getElementById('search').addEventListener('input',()=>{curPage=1;render();});
catEl.addEventListener('change',()=>{curPage=1;render();});
document.querySelectorAll('.langs button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.langs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');curLang=b.dataset.lang;render();};});
render();
</script></body></html>
