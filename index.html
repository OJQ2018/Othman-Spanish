    let tb=div.querySelector('.transBtn'); tb.onclick=()=>{if(revealed.has(d.id)) revealed.delete(d.id); else revealed.add(d.id); let box=div.querySelector('.transBox'); if(revealed.has(d.id)){box.classList.add('show'); tb.textContent='Hide / إخفاء'; tb.classList.add('active');} else {box.classList.remove('show'); tb.textContent='Translate / ترجمة'; tb.classList.remove('active');}};
    let rb=div.querySelector('.reviewBtn'); rb.onclick=()=>{review.delete(d.id); localStorage.setItem('review_clean', JSON.stringify([...review])); updateReviewCount(); renderReview();};
    let lb=div.querySelector('.learn'); lb.onclick=()=>{if(learned.has(d.id)) learned.delete(d.id); else learned.add(d.id); localStorage.setItem('learned_clean', JSON.stringify([...learned])); renderReview();};
    cards.appendChild(div);
  });
  function makePag(c){c.innerHTML=''; let pr=document.createElement('button'); pr.textContent='Previous / السابق'; pr.disabled=curPage===1; pr.onclick=()=>{curPage--; renderReview(); scrollTo({top:0,behavior:'smooth'});}; c.appendChild(pr); let start=Math.max(1,curPage-2), end=Math.min(tp,curPage+2); for(let i=start;i<=end;i++){let b=document.createElement('button'); b.textContent=i; if(i===curPage) b.className='active'; b.onclick=()=>{curPage=i; renderReview(); scrollTo({top:0,behavior:'smooth'});}; c.appendChild(b);} let nx=document.createElement('button'); nx.textContent='Next / التالي'; nx.disabled=curPage===tp; nx.onclick=()=>{curPage++; renderReview(); scrollTo({top:0,behavior:'smooth'});}; c.appendChild(nx);} makePag(document.getElementById('pagTop')); makePag(document.getElementById('pagBottom'));
}
function renderTopics(){

  let map=getTopics();
  let container=document.getElementById('topicsView');
  container.innerHTML='';
  let order = ["التحيات","الأرقام","الألوان","أيام الأسبوع","أشهر السنة","الوقت","العائلة","الصفات","الأفعال","الطعام","البيت","الجسم","الملابس","الطقس","الاتجاهات","السفر","التسوق","العمل","الحب","الطوارئ"];
  let entries = Object.entries(map).sort((a,b)=>{
    let ia = order.findIndex(o=>a[0].includes(o));
    let ib = order.findIndex(o=>b[0].includes(o));
    if(ia===-1) ia=999; if(ib===-1) ib=999; return ia-ib;
  });
  entries.forEach(([cat,info],idx)=>{
    let num = idx+1;
    let parts = cat.split(' / ');
    let left = parts[0]||cat; let right = parts[1]||'';
    let iconParts = left.trim().split(' ');
    let icon = iconParts[0]; let arName = iconParts.slice(1).join(' ')||left;
    let div=document.createElement('div'); div.className='topicCard';
    div.innerHTML=`<div class="num">#${num}</div><div class="icon">${icon}</div><div class="ar">${arName}</div><div class="en">${right}</div><div class="meta"><span class="count">📚 ${info.count}</span><span class="count a1">A1 ${info.a1}</span><span class="count a2">A2 ${info.a2}</span></div>`;
    div.onclick=()=>openTopic(cat);
    container.appendChild(div);
  });
  document.getElementById('sentencesView').style.display='none'; container.style.display='grid';
}
function openTopic(cat){curTopic=cat; curPage=1; revealed=new Set(); document.getElementById('topicsView').style.display='none'; document.getElementById('sentencesView').style.display='block'; document.getElementById('currentTopicTitle').textContent=cat; let map=getTopics(); document.getElementById('currentTopicCount').textContent=map[cat]?map[cat].count+' sentences':''; renderSentences(); window.scrollTo({top:0,behavior:'smooth'});}
function showTopics(){curTopic=''; document.getElementById('sentencesView').style.display='none'; document.getElementById('topicsView').style.display='grid'; renderTopics(); updateReviewCount();}
function getFilteredSentences(){let q=document.getElementById('search').value.toLowerCase().trim(); let lvlInside=document.getElementById('levelFilterInside').value; return data.filter(d=>{if(d.cat!==curTopic) return false; if(lvlInside && d.level!==lvlInside) return false; if(curLevel!=='ALL' && d.level!==curLevel) return false; if(!q) return true; return d.es.toLowerCase().includes(q)||d.ar.includes(q)||d.en.toLowerCase().includes(q)||d.de.toLowerCase().includes(q);});}
function speak(t,b){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.85; let vs=speechSynthesis.getVoices(); let v=vs.find(x=>x.lang.includes('es')); if(v) u.voice=v; b.classList.add('playing'); b.textContent='⏳'; u.onend=()=>{b.classList.remove('playing'); b.textContent='🔊';}; u.onerror=()=>{b.classList.remove('playing'); b.textContent='🔊';}; speechSynthesis.speak(u);}catch(e){}}
function renderSentences(){let f=getFilteredSentences(), tp=Math.max(1,Math.ceil(f.length/perPage)); if(curPage>tp) curPage=tp; let s=(curPage-1)*perPage, sl=f.slice(s,s+perPage); document.getElementById('stats').textContent=curTopic+' • '+f.length+' sentences • Page '+curPage+' of '+tp; let cards=document.getElementById('cards'); cards.innerHTML=''; if(sl.length===0){cards.innerHTML='<div style="text-align:center;padding:20px;color:var(--text2)">No sentences / لا توجد جمل</div>'; return;} sl.forEach(d=>{let isRev=revealed.has(d.id); let div=document.createElement('div'); div.className='card '+d.level; let trHTML=''; if(curLang==='ar') trHTML='<div class="tr ar">🇸🇦 '+d.ar+'</div>'; else if(curLang==='en') trHTML='<div class="tr en">🇬🇧 '+d.en+'</div>'; else if(curLang==='de') trHTML='<div class="tr de">🇩🇪 '+d.de+'</div>'; else trHTML='<div class="tr ar">🇸🇦 '+d.ar+'</div><div class="tr en">🇬🇧 '+d.en+'</div><div class="tr de">🇩🇪 '+d.de+'</div>'; div.innerHTML='<div class="cardHead"><span class="badge '+d.level+'">'+d.level+'</span><span>#'+d.id+' '+(learned.has(d.id)?'✅':'')+(review.has(d.id)?' ⭐':'')+'</span></div><div class="es">'+d.es+'</div><div class="transBox '+(isRev?'show':'')+'">'+trHTML+'</div><div class="actions"><button class="btn play">🔊</button><button class="btn transBtn '+(isRev?'active':'')+'">'+(isRev?'Hide / إخفاء':'Translate / ترجمة')+'</button><button class="btn reviewBtn '+(review.has(d.id)?'saved':'')+'">'+(review.has(d.id)?'⭐ Saved / محفوظ':'⭐ Save / حفظ')+'</button><button class="btn learn '+(learned.has(d.id)?'done':'')+'">'+(learned.has(d.id)?'✓ Done / تم':'Learned / تعلمت')+'</button></div>'; let pb=div.querySelector('.play'); pb.onclick=()=>speak(d.es,pb); let tb=div.querySelector('.transBtn'); tb.onclick=()=>{if(revealed.has(d.id)) revealed.delete(d.id); else revealed.add(d.id); let box=div.querySelector('.transBox'); if(revealed.has(d.id)){box.classList.add('show'); tb.textContent='Hide / إخفاء'; tb.classList.add('active');} else {box.classList.remove('show'); tb.textContent='Translate / ترجمة'; tb.classList.remove('active');}}; let lb=div.querySelector('.learn'); lb.onclick=()=>{if(learned.has(d.id)) learned.delete(d.id); else learned.add(d.id); localStorage.setItem('learned_clean',JSON.stringify([...learned])); renderSentences();}; cards.appendChild(div);}); function makePag(c){c.innerHTML=''; let pr=document.createElement('button'); pr.textContent='Previous / السابق'; pr.disabled=curPage===1; pr.onclick=()=>{curPage--; renderSentences(); scrollTo({top:0,behavior:'smooth'});}; c.appendChild(pr); let start=Math.max(1,curPage-2), end=Math.min(tp,curPage+2); for(let i=start;i<=end;i++){let b=document.createElement('button'); b.textContent=i; if(i===curPage) b.className='active'; b.onclick=()=>{curPage=i; renderSentences(); scrollTo({top:0,behavior:'smooth'});}; c.appendChild(b);} let nx=document.createElement('button'); nx.textContent='Next / التالي'; nx.disabled=curPage===tp; nx.onclick=()=>{curPage++; renderSentences(); scrollTo({top:0,behavior:'smooth'});}; c.appendChild(nx);} makePag(document.getElementById('pagTop')); makePag(document.getElementById('pagBottom'));}
document.getElementById('search').addEventListener('input',()=>{curPage=1; renderSentences();});
document.getElementById('levelFilterInside').addEventListener('change',()=>{curPage=1; renderSentences();});
document.querySelectorAll('.langs button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.langs button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); curLang=b.dataset.lang; renderSentences();};});
renderTopics(); updateReviewCount();
</script></body></html>
