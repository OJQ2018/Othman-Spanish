let curTopic=1; let curPage=1; const perPage=20; let curSearch='';

let transOpen={};
let globalLang = localStorage.getItem('global_trans_lang') || 'ar';
let curTheme = localStorage.getItem('theme_final') || 'dark';

function setTheme(t){curTheme=t; document.body.className=t; localStorage.setItem('theme_final', t); document.querySelectorAll('#themeRow button').forEach(b=>b.classList.toggle('active', b.dataset.theme===t));}
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.85;speechSynthesis.speak(u);}catch(e){}}
function updateCounts(){document.getElementById('reviewCount').textContent=saved.size;}
function setGlobalLang(lang){globalLang=lang; localStorage.setItem('global_trans_lang', lang); document.querySelectorAll('#langTop button').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang)); renderCards();}

function renderTOC(){
  let toc=document.getElementById('toc'); toc.innerHTML='';
  TOPICS.forEach(t=>{
    let level = t.id<=12 ? 'A1' : 'A2';
    let b=document.createElement('button'); 
    b.innerHTML=`<span class="levelBadge ${level}">${level}</span>${t.id}. ${t.ar}`;
    if(t.id===curTopic) b.classList.add('active');
    b.onclick=()=>{curTopic=t.id; curPage=1; renderCards(); renderTOC(); window.scrollTo({top:0,behavior:'smooth'});};
    toc.appendChild(b);
  });
}

function getFiltered(){
  let topic=TOPICS.find(t=>t.id===curTopic);
  if(!topic) return [];
  let items=topic.items;
  if(curSearch){
    let q=curSearch.toLowerCase();
    items=items.filter(it=>it.es.toLowerCase().includes(q) || it.ar.toLowerCase().includes(q));
  }
  return items;
}

function renderCards(){
  let topic=TOPICS.find(t=>t.id===curTopic);
  let items=getFiltered();
  let totalPages=Math.max(1, Math.ceil(items.length/perPage));
  if(curPage>totalPages) curPage=totalPages;
  let start=(curPage-1)*perPage; let pageItems=items.slice(start, start+perPage);

  let level = topic.id<=12 ? 'A1 - الأساسيات' : 'A2 - توسيع المحادثة';
  document.getElementById('stats').textContent=`#${topic.id} - ${topic.ar} - ${topic.es} - ${level} - ${items.length} جملة - صفحة ${curPage}/${totalPages} - 900 جملة`;
  document.getElementById('statsBottom').textContent=`صفحة ${curPage}/${totalPages} - 30 موضوع - 900 جملة - Soy de Irak 🇮🇶`;
  document.getElementById('prevBtn').disabled=curPage===1;
  document.getElementById('nextBtn').disabled=curPage===totalPages;

  let container=document.getElementById('cards'); container.innerHTML='';
  if(pageItems.length===0){
    container.innerHTML='<div style="text-align:center;padding:40px;color:var(--text2)">لا توجد نتائج<br>Soy de Irak 🇮🇶</div>';
    return;
  }

  pageItems.forEach((it, idx)=>{
    let actualGlobal = (curTopic-1)*30 + start+idx+1;
    let id=`card-${curTopic}-${start+idx+1}`;
    let isOpen=!!transOpen[id];
    let isSaved=saved.has(it.es);
    let isLearned=learned.has(it.es);
    let safe=it.es.replace(/'/g,"\'");
    let transText = it.ar;
    let levelClass = topic.id<=12 ? 'A1' : 'A2';

    let div=document.createElement('div');
    div.innerHTML=`
      <div class="card ${levelClass}">
        <div class="cardHead"><span class="num">#${actualGlobal} / 900 - موضوع ${curTopic} - #${start+idx+1}/30</span><span class="badge">${levelClass}</span></div>
        <div class="esBig">${it.es}</div>
        <div class="transArea ${isOpen?'show':''}" id="area-${id}">
          <div class="transText">🇸🇦 ${transText}</div>
        </div>
        <div class="actions">
          <button class="actBtn learned ${isLearned?'done':''}" onclick="toggleLearned('${safe}')"><span>/ Learned</span><small>تعلمت</small></button>
          <button class="actBtn save ${isSaved?'saved':''}" onclick="toggleSaved('${safe}')"><span>/ Save ${isSaved?'⭐':''}</span><small>حفظ</small></button>
          <button class="actBtn translate ${isOpen?'active':''}" onclick="toggleTrans('${id}')"><span>/ ${isOpen?'Hide':'Translate'}</span><small>${isOpen?'إخفاء':'ترجمة'}</small></button>
          <button class="actBtn speak" onclick="speak('${safe}')">🔊</button>
        </div>
      </div>
    `;
    container.appendChild(div);
  });
}

function toggleTrans(id){transOpen[id]=!transOpen[id]; renderCards();}
function changePage(d){let items=getFiltered(); let totalPages=Math.max(1, Math.ceil(items.length/perPage)); curPage+=d; if(curPage<1) curPage=1; if(curPage>totalPages) curPage=totalPages; renderCards(); window.scrollTo({top:0,behavior:'smooth'});}
function toggleSaved(es){if(saved.has(es)) saved.delete(es); else saved.add(es); localStorage.setItem('saved_900_exact', JSON.stringify([...saved])); updateCounts(); renderCards(); renderReview();}
function toggleLearned(es){if(learned.has(es)) learned.delete(es); else learned.add(es); localStorage.setItem('learned_900_exact', JSON.stringify([...learned])); renderCards();}
function openReview(){renderReview(); document.getElementById('reviewPanel').classList.add('open');}
function closeReview(){document.getElementById('reviewPanel').classList.remove('open');}
function renderReview(){
  let list=document.getElementById('reviewList');
  if(saved.size===0){list.innerHTML='<div style="text-align:center;padding:30px;color:var(--text2)">لا توجد جمل محفوظة<br>اضغط / Save حفظ ⭐<br>900 جملة</div>'; return;}
  list.innerHTML='';
  [...saved].forEach(es=>{
    let found=null;
    for(let t of TOPICS){let it=t.items.find(x=>x.es===es); if(it){found=it; break;}}
    if(!found) found={es:es, ar:'', en:'', de:''};
    let transText = found.ar;
    let div=document.createElement('div');
    div.style.cssText='padding:12px;border:1px solid var(--border);border-radius:10px;margin:8px 0;background:var(--card2);display:flex;justify-content:space-between;align-items:center;gap:8px';
    div.innerHTML=`<div><div style="font-weight:900;font-size:16px;color:var(--text)">${found.es}</div><div style="font-size:12px;color:var(--text2);margin-top:4px">🇸🇦 ${transText}</div></div><div style="display:flex;gap:6px"><button class="actBtn speak" onclick="speak('${found.es.replace(/'/g,"\'")}')">🔊</button><button class="actBtn save saved" onclick="toggleSaved('${found.es.replace(/'/g,"\'")}')">⭐</button></div>`;
    list.appendChild(div);
  });
}
