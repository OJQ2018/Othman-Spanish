let curTopic=1; let curPage=1; const perPage=100; let curSearch='';
let saved=new Set(JSON.parse(localStorage.getItem('saved_final_all')||'[]'));
let learned=new Set(JSON.parse(localStorage.getItem('learned_final_all')||'[]'));
let transOpen={};
let globalLang = localStorage.getItem('global_trans_lang') || 'ar';
let curTheme = localStorage.getItem('theme_final') || 'dark';

function setTheme(t){
  curTheme=t;
  document.body.className=t;
  localStorage.setItem('theme_final', t);
  document.querySelectorAll('#themeRow button').forEach(b=>b.classList.toggle('active', b.dataset.theme===t));
}

function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.85;speechSynthesis.speak(u);}catch(e){}}

function updateCounts(){document.getElementById('reviewCount').textContent=saved.size;}

function setGlobalLang(lang){
  globalLang=lang;
  localStorage.setItem('global_trans_lang', lang);
  document.querySelectorAll('#langTop button').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  renderCards();
}

function renderTOC(){
  let toc=document.getElementById('toc'); toc.innerHTML='';
  TOPICS.forEach(t=>{
    let b=document.createElement('button'); b.textContent=`${t.id}. ${t.ar}`; if(t.id===curTopic) b.classList.add('active');
    b.onclick=()=>{curTopic=t.id; curPage=1; renderCards(); renderTOC(); window.scrollTo({top:0,behavior:'smooth'});};
    toc.appendChild(b);
  });
}

function getFiltered(){
  let topic=TOPICS.find(t=>t.id===curTopic);
  if(!topic) return [];
  let items=topic.items;
  if(curSearch){
    let q=curSearch.toLowerCase();
    items=items.filter(it=>it.es.toLowerCase().includes(q) || it.ar.toLowerCase().includes(q) || it.en.toLowerCase().includes(q) || it.de.toLowerCase().includes(q));
  }
  return items;
}

function renderCards(){
  let topic=TOPICS.find(t=>t.id===curTopic);
  let items=getFiltered();
  let totalPages=Math.max(1, Math.ceil(items.length/perPage));
  if(curPage>totalPages) curPage=totalPages;
  let start=(curPage-1)*perPage; let pageItems=items.slice(start, start+perPage);

  document.getElementById('stats').textContent=`#${curTopic} - ${topic.ar} - ${topic.sent_count} جمل + ${topic.word_count} كلمات = ${items.length} - صفحة ${curPage}/${totalPages} - الجمل أولا ثم الكلمات`;
  document.getElementById('statsBottom').textContent=`صفحة ${curPage} من ${totalPages} - Soy de Irak 🇮🇶 - الوضع: ${curTheme==='dark'?'ليلي 🌙':curTheme==='light'?'نهاري ☀️':'هادئ 🍂'}`;
  document.getElementById('prevBtn').disabled=curPage===1;
  document.getElementById('nextBtn').disabled=curPage===totalPages;

  let container=document.getElementById('cards'); container.innerHTML='';
  if(pageItems.length===0){
    container.innerHTML='<div style="text-align:center;padding:40px;color:var(--text2)">لا توجد نتائج<br>Soy de Irak 🇮🇶</div>';
    return;
  }

  let currentSection='';
  pageItems.forEach((it, idx)=>{
    let globalIdx=start+idx+1;
    let id=`card-${curTopic}-${globalIdx}`;
    let isOpen=!!transOpen[id];
    let isSaved=saved.has(it.es);
    let isLearned=learned.has(it.es);
    let safe=it.es.replace(/'/g,"\'");
    let sectionNeeded='';
    if(it.type!==currentSection){
      currentSection=it.type;
      sectionNeeded=`<div class="sectionTitle">${it.type==='sentence'?'📝 أ) الجمل الضرورية - '+topic.sent_count+' جمل - الجمل أولا':'📚 ب) الكلمات الضرورية - '+topic.word_count+' كلمات'}</div>`;
    }
    let transText = globalLang==='ar' ? it.ar : globalLang==='en' ? it.en : it.de;
    let flag = globalLang==='ar' ? '🇸🇦' : globalLang==='en' ? '🇬🇧' : '🇩🇪';

    let div=document.createElement('div');
    div.innerHTML=sectionNeeded+`
      <div class="card ${it.type}">
        <div class="cardHead"><span class="num">#${globalIdx} ${it.type==='sentence'?'جملة':'كلمة'}</span><span class="badge ${it.type}">${it.type==='sentence'?'جملة':'كلمة'}</span></div>
        <div class="${it.type==='sentence'?'esBig':'esSmall'}">${it.es}</div>
        <div class="transArea ${isOpen?'show':''}" id="area-${id}">
          <div class="transText">${flag} ${transText}</div>
        </div>
        <div class="actions">
          <button class="actBtn learned ${isLearned?'done':''}" onclick="toggleLearned('${safe}')"><span>/ Learned</span><small>تعلمت</small></button>
          <button class="actBtn save ${isSaved?'saved':''}" onclick="toggleSaved('${safe}')"><span>/ Save ${isSaved?'⭐':''}</span><small>حفظ</small></button>
          <button class="actBtn translate ${isOpen?'active':''}" onclick="toggleTrans('${id}')"><span>/ ${isOpen?'Hide':'Translate'}</span><small>${isOpen?'إخفاء':'ترجمة'}</small></button>
          <button class="actBtn speak" onclick="speak('${safe}')">🔊</button>
        </div>
      </div>
    `;
    container.appendChild(div);
  });
}

function toggleTrans(id){transOpen[id]=!transOpen[id]; renderCards();}
function changePage(d){let items=getFiltered(); let totalPages=Math.max(1, Math.ceil(items.length/perPage)); curPage+=d; if(curPage<1) curPage=1; if(curPage>totalPages) curPage=totalPages; renderCards(); window.scrollTo({top:0,behavior:'smooth'});}
function toggleSaved(es){if(saved.has(es)) saved.delete(es); else saved.add(es); localStorage.setItem('saved_final_all', JSON.stringify([...saved])); updateCounts(); renderCards(); renderReview();}
function toggleLearned(es){if(learned.has(es)) learned.delete(es); else learned.add(es); localStorage.setItem('learned_final_all', JSON.stringify([...learned])); renderCards();}
function openReview(){renderReview(); document.getElementById('reviewPanel').classList.add('open');}
function closeReview(){document.getElementById('reviewPanel').classList.remove('open');}
function renderReview(){
  let list=document.getElementById('reviewList');
  if(saved.size===0){list.innerHTML='<div style="text-align:center;padding:30px;color:var(--text2)">لا توجد كلمات محفوظة<br>اضغط / Save حفظ ⭐</div>'; return;}
  list.innerHTML='';
  [...saved].forEach(es=>{
    let found=null;
    for(let t of TOPICS){let it=t.items.find(x=>x.es===es); if(it){found=it; break;}}
    if(!found) found={es:es, ar:'', en:'', de:''};
    let transText = globalLang==='ar' ? found.ar : globalLang==='en' ? found.en : found.de;
    let flag = globalLang==='ar' ? '🇸🇦' : globalLang==='en' ? '🇬🇧' : '🇩🇪';
    let div=document.createElement('div');
    div.style.cssText='padding:12px;border:1px solid var(--border);border-radius:10px;margin:8px 0;background:var(--card2);display:flex;justify-content:space-between;align-items:center;gap:8px';
    div.innerHTML=`<div><div style="font-weight:900;font-size:16px;color:var(--text)">${found.es}</div><div style="font-size:12px;color:var(--text2);margin-top:4px">${flag} ${transText}</div></div><div style="display:flex;gap:6px"><button class="actBtn speak" onclick="speak('${found.es.replace(/'/g,"\'")}')">🔊</button><button class="actBtn save saved" onclick="toggleSaved('${found.es.replace(/'/g,"\'")}')">⭐</button></div>`;
    list.appendChild(div);
  });
}

document.getElementById('search').addEventListener('input', e=>{curSearch=e.target.value; curPage=1; renderCards();});

document.body.className=curTheme;
renderTOC(); renderCards(); updateCounts();
setTimeout(()=>{
  document.querySelectorAll('#langTop button').forEach(b=>b.classList.toggle('active', b.dataset.lang===globalLang));
  document.querySelectorAll('#themeRow button').forEach(b=>b.classList.toggle('active', b.dataset.theme===curTheme));
},100);
</script></body></html>
